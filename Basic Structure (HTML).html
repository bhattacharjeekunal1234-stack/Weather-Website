<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky</title>
    <link rel="stylesheet" href="Colour Font (CSS).css">
</head>
<body>

    <div class="navbar">
        <h1>💠 Sky</h1>
        <div class="nav-buttons">
            <button>Today</button>
            <button>Forecast</button>
            <button>Map</button>
            <button>Alerts</button>
        </div>
    </div>

    <div class="middlebox">
        <p>Live weather data</p>
    </div>

    <div class="middle_part">
        <h1>What's the weather</h1>
        <div class="middlesmall">
            <h2>anywhere?</h2>
        </div>
        <p>Search any city in the world for instant conditions</p>
    </div>

    <div class="search-bar">
        <input type="text" id="cityInput" placeholder="Search city — New Delhi, Kolkata, Bengaluru..." />
        <button>Search</button>
    </div>

    <div id="weatherResult"></div>

    <div class="weather-icons">
        <div class="icon-card">
            <span>☀️</span>
            <p>Sunny</p>
        </div>
        <div class="icon-card">
            <span>⛅</span>
            <p>Partly Cloudy</p>
        </div>
        <div class="icon-card">
            <span>☁️</span>
            <p>Cloudy</p>
        </div>
        <div class="icon-card">
            <span>🌧️</span>
            <p>Rainy</p>
        </div>
        <div class="icon-card">
            <span>⛈️</span>
            <p>Stormy</p>
        </div>
        <div class="icon-card">
            <span>❄️</span>
            <p>Snowy</p>
        </div>
    </div>

    <div class="last-line">
        <p>Search a city to see live conditions</p>
    </div>

    <footer>
        <p>© 2026 Sky. All rights reserved.</p>
    </footer>

</body>
</html>
